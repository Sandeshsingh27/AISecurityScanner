name: Security Scan CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: Build and test
        run: mvn -B clean test

      - name: Run scanner in CLI mode
        env:
          SCANNER_LLM_ENABLED: 'false'
        run: >
          mvn -B spring-boot:run
          -Dspring-boot.run.arguments=--scanner.cli.enabled=true,--scanner.cli.target-path=${{ github.workspace }},--scanner.cli.fail-on-quality-gate=true

