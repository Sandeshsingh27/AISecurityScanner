rules:
  - id: java-runtime-exec
    message: User-controlled input reaching Runtime.exec may allow command injection.
    severity: ERROR
    languages: [java]
    pattern: Runtime.getRuntime().exec($CMD)
    metadata:
      owasp: OWASP A03:2021 - Injection
      cwe: CWE-78

  - id: java-processbuilder-user-input
    message: ProcessBuilder with untrusted input can lead to command injection.
    severity: WARNING
    languages: [java]
    pattern: new ProcessBuilder($ARGS)
    metadata:
      owasp: OWASP A03:2021 - Injection
      cwe: CWE-78

  - id: python-subprocess-shell-true
    message: subprocess with shell=True can execute injected commands.
    severity: ERROR
    languages: [python]
    pattern: subprocess.$FUNC(..., shell=True, ...)
    metadata:
      owasp: OWASP A03:2021 - Injection
      cwe: CWE-78

  - id: python-eval-exec
    message: eval/exec on untrusted input can result in arbitrary code execution.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: eval($X)
      - pattern: exec($X)
    metadata:
      owasp: OWASP A03:2021 - Injection
      cwe: CWE-94

  - id: js-eval
    message: eval on untrusted data can enable code injection.
    severity: ERROR
    languages: [javascript, typescript]
    pattern: eval($X)
    metadata:
      owasp: OWASP A03:2021 - Injection
      cwe: CWE-95

  - id: js-innerhtml
    message: Assigning untrusted content to innerHTML may enable XSS.
    severity: WARNING
    languages: [javascript, typescript]
    pattern: $EL.innerHTML = $VALUE
    metadata:
      owasp: OWASP A03:2021 - Injection
      cwe: CWE-79

  - id: java-hardcoded-secret
    message: Potential hardcoded secret in Java source.
    severity: ERROR
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: String $KEY = "$VAL";
          - pattern: private static final String $KEY = "$VAL";
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(password|passwd|secret|token|api[_-]?key|access[_-]?key|private[_-]?key).*
      - metavariable-regex:
          metavariable: $VAL
          regex: .{8,}
    metadata:
      owasp: OWASP A02:2021 - Cryptographic Failures
      cwe: CWE-798

  - id: python-hardcoded-secret
    message: Potential hardcoded secret in Python source.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: $KEY = "$VAL"
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(password|passwd|secret|token|api[_-]?key|access[_-]?key|private[_-]?key).*
      - metavariable-regex:
          metavariable: $VAL
          regex: .{8,}
    metadata:
      owasp: OWASP A02:2021 - Cryptographic Failures
      cwe: CWE-798

  - id: js-hardcoded-secret
    message: Potential hardcoded secret in JavaScript/TypeScript source.
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: const $KEY = "$VAL"
          - pattern: let $KEY = "$VAL"
          - pattern: var $KEY = "$VAL"
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(password|passwd|secret|token|api[_-]?key|access[_-]?key|private[_-]?key).*
      - metavariable-regex:
          metavariable: $VAL
          regex: .{8,}
    metadata:
      owasp: OWASP A02:2021 - Cryptographic Failures
      cwe: CWE-798

  - id: config-hardcoded-secret
    message: Potential hardcoded secret in config file.
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/*.properties"
        - "**/*.yml"
        - "**/*.yaml"
        - "**/*.json"
        - "**/*.env"
    pattern-regex: (?i)(password|passwd|secret|token|api[_-]?key|access[_-]?key|private[_-]?key)\s*[:=]\s*["']?[A-Za-z0-9_\-\/+]{8,}["']?
    metadata:
      owasp: OWASP A02:2021 - Cryptographic Failures
      cwe: CWE-798

