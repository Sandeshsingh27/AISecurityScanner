spring.application.name=ai-security-scanner
server.port=8080

scanner.semgrep.command=${SCANNER_SEMGREP_COMMAND:semgrep}
scanner.semgrep.default-config=auto
scanner.semgrep.timeout-seconds=300

scanner.llm.enabled=false
scanner.llm.provider-label=GitHub Models
scanner.llm.base-url=https://models.inference.ai.azure.com/chat/completions
scanner.llm.api-key=${SCANNER_LLM_API_KEY:}
scanner.llm.model=${SCANNER_LLM_MODEL:gpt-4o-mini}
scanner.llm.max-tokens=900
scanner.llm.temperature=0.2

scanner.report.context-lines=10
scanner.report.max-findings-for-llm=15

scanner.cli.enabled=false
scanner.cli.target-path=.
scanner.cli.fail-on-quality-gate=true

