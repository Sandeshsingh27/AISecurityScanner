spring.application.name=ai-security-scanner
server.port=8080

scanner.semgrep.command=${SCANNER_SEMGREP_COMMAND:semgrep}
scanner.semgrep.default-config=${SCANNER_SEMGREP_DEFAULT_CONFIG:semgrep-rules/offline-security.yml}
scanner.semgrep.timeout-seconds=${SCANNER_SEMGREP_TIMEOUT_SECONDS:1800}
scanner.semgrep.jobs=${SCANNER_SEMGREP_JOBS:8}
scanner.semgrep.fast-rule-timeout-seconds=${SCANNER_SEMGREP_FAST_RULE_TIMEOUT_SECONDS:8}
scanner.semgrep.fast-excludes=.git,node_modules,target,build,dist,.venv,venv

scanner.agent.enabled=${SCANNER_AGENT_ENABLED:false}
scanner.agent.command=${SCANNER_AGENT_COMMAND:}
scanner.agent.timeout-seconds=${SCANNER_AGENT_TIMEOUT_SECONDS:180}

scanner.llm.enabled=false
scanner.llm.provider-label=GitHub Models
scanner.llm.base-url=https://models.inference.ai.azure.com/chat/completions
scanner.llm.api-key=${SCANNER_LLM_API_KEY:}
scanner.llm.model=${SCANNER_LLM_MODEL:gpt-4o-mini}
scanner.llm.max-tokens=900
scanner.llm.temperature=0.2

scanner.report.context-lines=10
scanner.report.max-findings-for-llm=15

scanner.cli.enabled=false
scanner.cli.target-path=.
scanner.cli.fail-on-quality-gate=true

